name: CI

# Actions minutes and Cloudflare deploys are limited, so:
# - Checks run ONLY when started by hand (Actions tab > CI > "Run workflow").
#   Pull requests start nothing: run `pnpm check` locally before every push
#   and every merge instead.
# - Merging into main still deploys, but only when app or package code
#   changed. "Run workflow" on main with "Deploy" ticked deploys by hand.
# - Docs-only changes run nothing.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '!**.md'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare (main only) instead of running the checks'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    if: github.event_name == 'workflow_dispatch' && !inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the Worker bundles
        run: pnpm --filter @colonizers/server deploy:check

  deploy:
    name: Deploy to Cloudflare
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set, so deploy is skipped. See docs/DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.ready == 'true'
      - run: pnpm build
        if: steps.secrets.outputs.ready == 'true'
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/server
        run: |
          pnpm exec wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: steps.secrets.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/api/health" | grep -q '"ok":true'; then
              echo "Live at $url"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed at $url/api/health"
          exit 1
